AWSTemplateFormatVersion: "2010-09-09"
Description: CloudFormation template to create an EC2 instance with user data

Resources:

  TestingKeyPair:
    Type: AWS::EC2::KeyPair
    Properties:
      KeyName: TestingKeyPair

  MyEC2Instance:
    Type: "AWS::EC2::Instance"
    Properties: 
      InstanceType: "t2.micro"
      KeyName: !Ref TestingKeyPair  # Replace with your key pair
      ImageId: "ami-04a81a99f5ec58529"  # Replace with the desired AMI ID
      SecurityGroups:
        - !Ref InstanceSecurityGroup
      UserData: 
        !Base64 |
          #!/bin/bash
          sudo apt install -y unzip
          curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
          unzip awscliv2.zip
          sudo ./aws/install
          aws s3 cp s3://ctatisetti-practice-ansible/master_user_data.sh ~/.
          chmod +x master_user_data.sh

  InstanceSecurityGroup:
    Type: "AWS::EC2::SecurityGroup"
    Properties:
      GroupDescription: "Enable SSH and HTTP access"
      SecurityGroupIngress:
        - IpProtocol: "tcp"
          FromPort: 22
          ToPort: 22
          CidrIp: "0.0.0.0/0"
        - IpProtocol: "tcp"
          FromPort: 80
          ToPort: 80
          CidrIp: "0.0.0.0/0"

Outputs:
  InstanceId:
    Description: "The Instance ID"
    Value: !Ref MyEC2Instance
  PublicIP:
    Description: "Public IP address of the EC2 instance"
    Value: !GetAtt MyEC2Instance.PublicIp